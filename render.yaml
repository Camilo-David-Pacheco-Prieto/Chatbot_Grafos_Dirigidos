# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: chatbot-grafos-dirigidos
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Se piden en el dashboard al crear el Blueprint; no se versionan valores.
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: CALLBACK_SECRET
        sync: false
